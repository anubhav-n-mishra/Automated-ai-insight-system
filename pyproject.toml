[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "insight-engine"
version = "1.0.0"
description = "Config-driven analytics engine that turns period-over-period metric movements into ranked, explainable insights, decks, dashboards and audio briefings."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Anubhav Mishra" }]
maintainers = [{ name = "Anubhav Mishra" }]
keywords = [
    "analytics",
    "business-intelligence",
    "insights",
    "root-cause-analysis",
    "reporting",
    "powerpoint",
    "llm",
    "fastapi",
    "polars",
    "duckdb",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
    "python-pptx>=0.6.23",
    "qrcode[pil]>=7.4.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Relational sources. connectorx is optional because it ships prebuilt wheels
# for a narrower platform matrix than SQLAlchemy.
sql = ["sqlalchemy>=2.0.30", "connectorx>=0.3.3; python_version < '3.13'"]
postgres = ["psycopg[binary]>=3.1.18"]
mysql = ["pymysql>=1.1.1"]

# Narrative providers. The engine degrades to a deterministic template writer
# when none are installed, so neither is required.
gemini = ["google-genai>=1.0.0"]
openai = ["openai>=1.40.0"]

# Observability
otel = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]

all = ["insight-engine[sql,postgres,mysql,gemini,openai,otel]"]

dev = [
    "insight-engine[all]",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "pre-commit>=3.7.0",
    "pip-audit>=2.7.0",
]

docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.5.0"]

[project.scripts]
insight-engine = "insight_engine.cli:main"

[project.urls]
Homepage = "https://github.com/anubhav-n-mishra/Automated-ai-insight-system"
Documentation = "https://github.com/anubhav-n-mishra/Automated-ai-insight-system/tree/main/docs"
Repository = "https://github.com/anubhav-n-mishra/Automated-ai-insight-system"
Issues = "https://github.com/anubhav-n-mishra/Automated-ai-insight-system/issues"
Changelog = "https://github.com/anubhav-n-mishra/Automated-ai-insight-system/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/insight_engine"]

[tool.hatch.build.targets.sdist]
include = ["src/insight_engine", "tests", "examples", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

# --------------------------------------------------------------------------- #
# Lint / format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "DTZ",      # naive datetimes
    "T20",      # print statements
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",      # ruff-specific
    "S",        # bandit security rules
    "ASYNC",    # async antipatterns
]
ignore = [
    "S101",  # assert is fine in tests and internal invariants
    "B008",  # FastAPI Depends()/File() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"src/insight_engine/cli.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["insight_engine"]

# --------------------------------------------------------------------------- #
# Types
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
files = ["src/insight_engine"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

# Optional extras and libraries that ship no type information. Listing them
# explicitly keeps `strict` on for everything we actually own.
[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "pptx.*",
    "qrcode.*",
    "connectorx.*",
    "sqlalchemy.*",
    "opentelemetry.*",
    "PIL.*",
]
ignore_missing_imports = true

# python-pptx carries partial inline annotations: many public constructors are
# untyped and `add_chart` is annotated with a supertype it does not accept. The
# renderer is exercised end to end by the integration tests instead.
[[tool.mypy.overrides]]
module = ["insight_engine.engine.report.*"]
disallow_untyped_calls = false
warn_return_any = false
disable_error_code = ["arg-type", "attr-defined"]

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=insight_engine",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=70",
]
markers = [
    "integration: exercises the full pipeline or the HTTP surface",
    "slow: takes more than a second",
]
filterwarnings = ["error", "default::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["src/insight_engine"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
