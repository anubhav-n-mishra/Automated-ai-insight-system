name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests --output-format=github

      - name: Ruff (format)
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy

      - name: Specification schema is current
        # The published JSON Schema is a contract. Regenerating it here catches
        # a spec change that forgot to update it.
        run: |
          insight-engine schema -o /tmp/schema.json
          diff -u schemas/analysis-spec-v1.json /tmp/schema.json

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The renderer touches the filesystem and fonts, so the other two
          # platforms are worth one run each rather than a full matrix.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest --junitxml=junit.xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            junit.xml
          retention-days: 7

  cli:
    name: End-to-end CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install .

      - name: Validate the bundled examples
        run: |
          for spec in examples/configs/*.yaml; do
            insight-engine validate "$spec"
          done

      - name: Generate a report end to end
        # Runs with no API key configured, which is the path most users hit
        # first: it must produce a real deck from the template writer.
        run: insight-engine run examples/configs/marketing-csv.yaml --log-format text

      - name: The deck is a real presentation
        run: |
          set -euo pipefail
          deck=$(find var/reports -name '*.pptx' | head -1)
          test -n "$deck"
          python -c "
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
          assert 'ppt/presentation.xml' in names, names[:10]
          slides = [n for n in names if n.startswith('ppt/slides/slide')]
          assert len(slides) >= 7, f'expected a full deck, got {len(slides)} slides'
          print(f'deck has {len(slides)} slides')
          " "$deck"

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans only the commits a PR introduces via a revision
          # range of the form `<sha>^..<sha>`, which needs the parent commit
          # to resolve `<sha>^`. checkout's default fetch-depth: 1 fetches
          # only the head commit itself, so that range is unresolvable
          # ("unknown revision") and the step fails before it scans anything.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Dependency vulnerabilities
        # --skip-editable: the package under test is installed editable (-e .)
        # and was never published to PyPI, so pip-audit can never resolve or
        # audit it — that is expected and permanent, not a transient gap.
        #
        # --strict is deliberately left off: pip-audit 2.10.1 treats *any*
        # collection gap as a hard failure under --strict, including one this
        # explicitly told it to skip, so the two flags cannot be combined here
        # without --strict vetoing --skip-editable on every run. Every actual
        # dependency is still fully resolved and audited either way, and a
        # real vulnerability anywhere among them still fails the job through
        # pip-audit's normal (non-zero-on-findings) exit code.
        run: pip-audit --desc --skip-editable

      - name: Static analysis (Ruff security rules)
        run: ruff check src --select S --output-format=github

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: insight-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci
            VCS_REF=${{ github.sha }}

      - name: The image boots and serves readiness
        run: |
          set -euo pipefail
          docker run -d --name ie -p 8000:8000 insight-engine:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready > /dev/null; then
              echo "ready after ${attempt}s"
              curl -fsS http://127.0.0.1:8000/health
              docker rm -f ie
              exit 0
            fi
            sleep 1
          done
          echo "container never became ready"
          docker logs ie
          docker rm -f ie
          exit 1

      - name: The image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id insight-engine:ci -u)
          test "$uid" != "0" || { echo "image runs as root"; exit 1; }
          echo "running as uid $uid"
