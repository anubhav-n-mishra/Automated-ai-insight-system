# Local and small-deployment stack.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Copy .env.example to .env first. The service reads it, so secrets never live
# in this file or in shell history.

services:
  insight-engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        EXTRAS: "[sql,postgres]"
    image: insight-engine:local
    env_file:
      - ../.env
    environment:
      INSIGHT_ENGINE_HOST: 0.0.0.0
      INSIGHT_ENGINE_DATA_DIR: /var/lib/insight-engine
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - insight-data:/var/lib/insight-engine
    restart: unless-stopped

    # Defence in depth. The application never writes outside its data volume,
    # so everything else can be locked down.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          # Polars and DuckDB will use whatever they are given; a ceiling keeps
          # one oversized upload from taking the host down with it.
          memory: 2G
        reservations:
          memory: 512M

volumes:
  insight-data:
